[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-02-01
reason = "glob keeps walking after its AbortSignal fires. Present only through lighthouse 13.6.0 (@sentry/node, @sentry/bundler-plugins), used by the local pnpm perf script on the project's own files. Fixed only in glob 14; the Sentry packages still require glob 13. Reviewed 2026-11-01."
