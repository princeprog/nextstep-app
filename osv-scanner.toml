# OSV-Scanner exceptions for pnpm-lock.yaml (see .github/workflows/security.yml).
# Every entry needs a reason and expires, so the scan fails again and the finding is reviewed.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-01
reason = "minimatch denial of service through crafted glob patterns. Present only in build and lint tooling (ESLint plugins, typescript-estree, the shadcn CLI), which never receives untrusted patterns. Fixed only in minimatch 11.0.1, and those tools still require minimatch 3, 5, or 10. Reviewed 2026-11-01."

