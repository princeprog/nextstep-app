version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait a week after a release before proposing it, so a compromised or broken publish is usually caught first.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint 10 is outside the peer range of the plugins bundled with eslint-config-next 16.4.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # The project runs on Node 24; its types follow the runtime, not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
