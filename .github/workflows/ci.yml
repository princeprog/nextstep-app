name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded runs on branches and pull requests are cancelled; every push to main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests against the API
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nextstep-app
          persist-credentials: false
      - name: Check out the API (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: princeprog/nextstep-api
          ref: main
          path: nextstep-api
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: nextstep-api/pom.xml

      - name: Install PostgreSQL 18 server binaries (PGDG)
        timeout-minutes: 10
        run: |
          # Install binaries only; the throwaway cluster is created by the runner user in the next step.
          sudo install -d /etc/postgresql-common/createcluster.d /usr/share/postgresql-common/pgdg
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.d/00-no-main-cluster.conf
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          # A package mirror can stall; give each attempt a deadline and try up to three times.
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update \
              && timeout 300 sudo apt-get install --yes --no-install-recommends postgresql-18; then
              exit 0
            fi
            echo "::warning::Installing PostgreSQL failed or stalled (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      - name: Start a throwaway PostgreSQL cluster
        run: |
          pg_bin=/usr/lib/postgresql/18/bin
          pgdata="$RUNNER_TEMP/pgdata"
          super_password="$(openssl rand -hex 24)"
          app_password="$(openssl rand -hex 24)"
          echo "::add-mask::$super_password"
          echo "::add-mask::$app_password"
          pwfile="$(mktemp)"
          printf '%s' "$super_password" > "$pwfile"
          "$pg_bin/initdb" -D "$pgdata" -U postgres --auth=scram-sha-256 --pwfile="$pwfile" \
            -E UTF8 --locale=C --locale-provider=builtin --builtin-locale=C.UTF-8
          rm -f "$pwfile"
          "$pg_bin/pg_ctl" -D "$pgdata" -l "$RUNNER_TEMP/postgres.log" -w start \
            -o "-c listen_addresses=127.0.0.1 -c port=5432 -c unix_socket_directories=$RUNNER_TEMP"
          PGPASSWORD="$super_password" "$pg_bin/psql" -h 127.0.0.1 -p 5432 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -q \
            -c "CREATE ROLE nextstep LOGIN PASSWORD '$app_password'" \
            -c "CREATE DATABASE nextstep OWNER nextstep"
          {
            echo "DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/nextstep"
            echo "DATABASE_USER=nextstep"
            echo "DATABASE_PASSWORD=$app_password"
          } >> "$GITHUB_ENV"

      - name: Start Mailpit
        # A local SMTP server with an HTTP API. The API sends confirmation and reset emails to it, and the tests read
        # the links from http://127.0.0.1:8025. Downloaded from its GitHub release and checked against a pinned hash;
        # change the version and the hash together.
        env:
          MAILPIT_VERSION: v1.33.0
          MAILPIT_SHA256: d0ec50080cbf3e7c1fa2cda2ee68125d7894175811084b1f8f47c6cfc6f487c8
        run: |
          archive="$RUNNER_TEMP/mailpit-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/axllent/mailpit/releases/download/$MAILPIT_VERSION/mailpit-linux-amd64.tar.gz"
          echo "$MAILPIT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mailpit"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mailpit" mailpit
          nohup "$RUNNER_TEMP/mailpit/mailpit" --listen 127.0.0.1:8025 --smtp 127.0.0.1:1025 \
            > "$RUNNER_TEMP/mailpit.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mailpit.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8025/readyz; then
              echo "Mailpit is ready after $attempt checks"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/mailpit.pid")" 2>/dev/null; then
              echo "::error::Mailpit exited during startup"
              tail -n 50 "$RUNNER_TEMP/mailpit.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::Mailpit did not answer within 30 seconds"
          tail -n 50 "$RUNNER_TEMP/mailpit.log"
          exit 1

      - name: Build the API
        working-directory: nextstep-api
        run: ./mvnw -B -DskipTests package

      - name: Start the API
        working-directory: nextstep-api
        env:
          # The suite creates many accounts and demos, and asks for many emailed links, from one address.
          DEMO_RATE_LIMIT_PER_HOUR: "1000"
          DEMO_GLOBAL_RATE_LIMIT_PER_HOUR: "1000"
          REGISTER_RATE_LIMIT_PER_HOUR: "1000"
          LOGIN_RATE_LIMIT_PER_WINDOW: "1000"
          EMAIL_REQUEST_RATE_LIMIT_PER_HOUR: "1000"
          LINK_RATE_LIMIT_PER_WINDOW: "1000"
          # The hourly email allowance for all visitors together: emails sent, and register, resend, and reset requests.
          EMAIL_GLOBAL_LIMIT_PER_HOUR: "100000"
          # Send email to Mailpit (plain SMTP on loopback). Links point at APP_PUBLIC_ORIGIN, http://localhost:3000.
          MAIL_MODE: smtp
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: "1025"
          MAIL_SMTP_AUTH: "false"
          MAIL_STARTTLS: "false"
        run: |
          jar="$(find target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          nohup java -jar "$jar" > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in $(seq 1 90); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/api/v1/auth/csrf; then
              echo "API is ready after $attempt checks"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null; then
              echo "::error::The API exited during startup"
              tail -n 100 "$RUNNER_TEMP/api.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::The API did not answer within 3 minutes"
          tail -n 100 "$RUNNER_TEMP/api.log"
          exit 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: nextstep-app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nextstep-app/pnpm-lock.yaml
      - name: Install app dependencies
        working-directory: nextstep-app
        run: pnpm install --frozen-lockfile
      - name: Build the app
        working-directory: nextstep-app
        run: pnpm build
      - name: Install Playwright Chromium
        working-directory: nextstep-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: nextstep-app
        run: pnpm test:e2e

      - name: Upload reports and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            nextstep-app/playwright-report/
            nextstep-app/test-results/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/postgres.log
            ${{ runner.temp }}/mailpit.log

  image:
    name: Container image builds and starts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: |
          docker build --tag nextstep-app:ci \
            --build-arg API_ORIGIN=http://127.0.0.1:8080 \
            --build-arg NEXT_PUBLIC_SITE_URL=https://nextstep.example .
      - name: Start it and check the sign-in page
        run: |
          docker run --detach --name app --publish 127.0.0.1:3000:3000 nextstep-app:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/login; then
              echo "Serving after $attempt checks"
              break
            fi
            sleep 1
          done
          headers="$(curl --silent --fail --dump-header - --output /dev/null http://127.0.0.1:3000/login)"
          echo "$headers" | grep -qi '^content-security-policy:.*nonce-' || { echo "::error::No nonce-based CSP"; exit 1; }
          echo "$headers" | grep -qi '^strict-transport-security: max-age=' || { echo "::error::No HSTS header"; exit 1; }
          curl --silent --fail http://127.0.0.1:3000/login | grep -q 'https://nextstep.example/terms/' \
            || curl --silent --fail http://127.0.0.1:3000/register | grep -q 'https://nextstep.example/terms/' \
            || { echo "::error::The build didn't use NEXT_PUBLIC_SITE_URL"; exit 1; }
          if [ "$(docker exec app id -u)" = "0" ]; then
            echo "::error::The app container runs as root"
            exit 1
          fi
          echo "The image serves the app with its security headers as a non-root user."
      - name: Show the app log
        if: failure()
        run: docker logs app || true

  staging:
    # A fresh, isolated production-like environment for every push: the API and app images, PostgreSQL, Mailpit, and
    # Caddy with local TLS (staging/compose.yaml), checked by the staging tests.
    name: Production-like staging in containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nextstep-app
          persist-credentials: false
      - name: Check out the API (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: princeprog/nextstep-api
          ref: main
          path: nextstep-api
          persist-credentials: false
      - name: Check out the website (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: princeprog/nextstep
          ref: main
          path: nextstep
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: nextstep-app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the website for the staging origins
        working-directory: nextstep
        env:
          SITE_ENV: production
          SITE_PUBLIC_ORIGIN: https://nextstep.localhost:8443
          PUBLIC_APP_URL: https://app.nextstep.localhost:8443/register
          PUBLIC_DEMO_URL: https://app.nextstep.localhost:8443/demo
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Start staging
        working-directory: nextstep-app
        run: |
          db_password="$(openssl rand -hex 24)"
          hash_key="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$hash_key"
          {
            echo "STAGING_DB_PASSWORD=$db_password"
            echo "STAGING_IDENTIFIER_HASH_KEY=$hash_key"
          } >> "$GITHUB_ENV"
          STAGING_DB_PASSWORD="$db_password" STAGING_IDENTIFIER_HASH_KEY="$hash_key" \
            docker compose -f staging/compose.yaml up --build --detach --wait
          for attempt in $(seq 1 90); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8081/actuator/health/readiness \
              && curl --silent --fail --insecure --output /dev/null \
                --resolve app.nextstep.localhost:8443:127.0.0.1 https://app.nextstep.localhost:8443/login; then
              echo "Staging is up after $attempt checks"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Staging didn't come up within 3 minutes"
          exit 1
      - name: Install app dependencies
        working-directory: nextstep-app
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: nextstep-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the staging tests
        working-directory: nextstep-app
        run: pnpm test:staging
      - name: Save the container logs
        if: failure()
        working-directory: nextstep-app
        run: docker compose -f staging/compose.yaml logs --no-color > "$RUNNER_TEMP/staging.log" 2>&1 || true
      - name: Upload reports and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-failure-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            nextstep-app/test-results/
            ${{ runner.temp }}/staging.log
