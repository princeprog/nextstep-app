name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so new advisories are noticed even when nothing changes.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: pnpm audit (high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit the lockfile
        run: pnpm audit --audit-level high

  osv:
    name: OSV-Scanner (pnpm-lock.yaml)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # To update, change both values; the hash comes from the release's osv-scanner_SHA256SUMS.
      OSV_SCANNER_VERSION: v2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify OSV-Scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan the lockfile
        # Reviewed exceptions, each with a reason and an expiry date, are in osv-scanner.toml.
        run: '"$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml'

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # To update, change both values; the hash comes from the release's gitleaks_<version>_checksums.txt.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
